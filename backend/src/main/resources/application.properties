# App
spring.application.name=tenant-portal

# Server
server.port=8080

# Database (placeholders — real values go in Doppler later)
spring.datasource.url=jdbc:mysql://localhost:3306/tenantportal
spring.datasource.username=tenantuser
spring.datasource.password=tenant123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS (allows React frontend on port 5173 to talk to this)
spring.web.cors.allowed-origins=http://localhost:5173
