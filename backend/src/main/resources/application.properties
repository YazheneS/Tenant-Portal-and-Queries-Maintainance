# App
spring.application.name=tenant-portal

# Server
server.port=8080

# Database (placeholders — real values go in Doppler later)
spring.datasource.url=jdbc:mysql://localhost:3306/tenantportal
spring.datasource.username=tenantuser
spring.datasource.password=tenant123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clerk JWT verification
clerk.issuer=https://grateful-lemur-7755.clerk.accounts.dev
clerk.jwks-uri=https://grateful-lemur-7755.clerk.accounts.dev/.well-known/jwks.json

# CORS
app.cors.allowed-origins=http://localhost:5173,https://your-frontend-domain.com

# Razorpay (Module 5) — test-mode keys from dashboard, move to Doppler before real use
razorpay.key-id=rzp_test_REPLACE_ME
razorpay.key-secret=REPLACE_ME
razorpay.webhook-secret=REPLACE_ME

# Cloudinary (Module 3 — complaint photo uploads) — move to Doppler before real use
cloudinary.cloud-name=REPLACE_ME
cloudinary.api-key=REPLACE_ME
cloudinary.api-secret=REPLACE_ME

# Mail (Module 3 + 4 notifications) — example for Gmail SMTP; swap for your provider
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=REPLACE_ME
spring.mail.password=REPLACE_ME
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=no-reply@tenantportal.local
app.mail.owner-address=REPLACE_ME

# Upload size limit (complaint photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB